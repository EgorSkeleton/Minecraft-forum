{% extends "main/base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-container">
    <div class="block-box shadow-lg">
        <h2 class="auth-title">Создание аккаунта</h2>
        <p class="text-center text-muted small">Добро пожаловать в наше комьюнити!</p>

        <form class="auth-form" method="POST" action="{% url 'account_signup' %}">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button class="btn-custom w-100 mt-3" type="submit">Зарегистрироваться</button>
        </form>

        <div class="auth-secondary-links text-center mt-4">
            <p class="text-muted">Уже есть аккаунт? <a href="{% url 'account_login' %}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
