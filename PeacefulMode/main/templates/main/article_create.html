{% extends "main/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'main/css/dashboard.css' %}">

<div class="container mt-4">
    <div class="block-box p-4 shadow" style="background-color: #1a1a1a; border: 1px solid #88b32d; border-radius: 10px;">
        <h2 class="text-warning mb-4">⛏️ Создание новой статьи</h2>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
                {% for field in form %}
                    <div class="{% if field.name == 'full_text' or field.name == 'short_text' %}col-12{% else %}col-md-6{% endif %} mb-4">
                        <label class="form-label text-warning fw-bold small text-uppercase">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div class="mt-4 border-top border-secondary pt-4">
                <button type="submit" class="btn px-5 shadow-sm" 
                        style="background-color: #ffda00; color: #1a1a1a; font-weight: bold; border: none; transition: 0.3s;"
                        onmouseover="this.style.backgroundColor='#88b32d'; this.style.color='#fff'"
                        onmouseout="this.style.backgroundColor='#ffda00'; this.style.color='#1a1a1a'">
                    Опубликовать статью
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary ms-2 text-white border-secondary px-4">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('.select2-special').select2({
            placeholder: "Выберите жанры...",
            allowClear: true,
            width: '100%'
        });
    });
</script>
{% endblock %}
